<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="18" fill="url(#grid)" />

  <!-- Decorative Glow Circles -->
  <circle cx="185" cy="180" r="145" fill="#38bdf8" opacity="0.08" />
  <circle cx="980" cy="120" r="180" fill="#6366f1" opacity="0.08" />
  <circle cx="720" cy="290" r="130" fill="#10b981" opacity="0.06" />

  <!-- Top & Bottom Accent Bars -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#brandGrad)" />
  <rect x="0" y="356" width="1200" height="4" fill="url(#brandGrad)" />

  <!-- Quantitative / Neural Intelligence Emblem -->
  <g transform="translate(85, 68)">
    <polygon points="100,0 190,52 190,156 100,208 10,156 10,52"
             fill="#0f172a" stroke="url(#brandGrad)" stroke-width="4.5" />
    <polygon points="100,16 174,60 174,148 100,192 26,148 26,60"
             fill="#1e293b" opacity="0.65" />
    <!-- Neural Graph + Quantitative Curve Inside Emblem -->
    <polyline points="42,138 72,108 102,124 132,72 158,54"
              fill="none" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Candlesticks / Gamma Bars -->
    <rect x="48" y="142" width="12" height="24" rx="2" fill="#38bdf8" opacity="0.85" />
    <rect x="74" y="122" width="12" height="44" rx="2" fill="#6366f1" opacity="0.85" />
    <rect x="100" y="132" width="12" height="34" rx="2" fill="#38bdf8" opacity="0.85" />
    <rect x="126" y="96" width="12" height="70" rx="2" fill="#10b981" opacity="0.9" />
    <!-- Nodes -->
    <circle cx="42" cy="138" r="5" fill="#38bdf8" />
    <circle cx="72" cy="108" r="5" fill="#818cf8" />
    <circle cx="102" cy="124" r="5" fill="#38bdf8" />
    <circle cx="132" cy="72" r="5.5" fill="#10b981" />
    <circle cx="158" cy="54" r="6.5" fill="#fde047" />
  </g>

  <!-- Title & Subtitle -->
  <text x="315" y="114" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#f8fafc" letter-spacing="1">
    KHALID NAAMI <tspan fill="url(#brandGrad)">INTELLIGENCE</tspan>
  </text>

  <text x="317" y="154" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="19.5" font-weight="500" fill="#94a3b8">
    Founder &amp; CEO @ Dashboard Options • Quantitative Finance, Global Macro, OSINT &amp; Financial AI
  </text>

  <!-- Stat Pills -->
  <g transform="translate(315, 186)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="255" height="66" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="18" y="28" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800" fill="#38bdf8">Options &amp; Quant AI</text>
    <text x="18" y="49" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#cbd5e1">GEX, Vanna, Charm &amp; Microstructure</text>

    <!-- Pill 2 -->
    <rect x="272" y="0" width="265" height="66" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="290" y="28" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800" fill="#818cf8">D3 Brain + Local RAG</text>
    <text x="290" y="49" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#cbd5e1">Interactive Graph &amp; Ollama AI Chat</text>

    <!-- Pill 3 -->
    <rect x="554" y="0" width="275" height="66" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="572" y="28" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800" fill="url(#goldGrad)">IronWall Hardened</text>
    <text x="572" y="49" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#cbd5e1">0 Vulnerabilities • AEO/GEO Ready</text>
  </g>

  <!-- Bottom Domain Strip -->
  <text x="317" y="294" font-family="Consolas, monospace" font-size="13.5" font-weight="600" fill="#64748b">
    KHALIDNAAMI.COM • QUANTITATIVE DERIVATIVES • GEOPOLITICAL OSINT • MACROECONOMICS • LLMS.TXT AEO/GEO • DOCUSAURUS 3
  </text>
</svg>
